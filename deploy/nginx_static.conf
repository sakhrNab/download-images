server {
    listen 80;
    server_name download.aiwaverider.com;

    root /var/www/download;
    index index.html index.htm;

    # Serve static files directly
    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: small health endpoint proxy to app if needed
    location /health {
        try_files /health =200;
    }
}
